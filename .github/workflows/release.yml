name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv --version

      - name: Install project dependencies
        shell: bash
        run: |
          uv sync --group dev

      - name: Build Python package
        shell: bash
        run: |
          mkdir -p package-dist
          uv build --out-dir package-dist

      - name: Build Standalone Executable
        shell: pwsh
        run: |
          uv pip install pip
          set PYINSTALLER_COMPILE_BOOTLOADER=1
          set "PYINSTALLER_BOOTLOADER_WAF_ARGS=--example-option=example-value --example-flag"
          uv run python -m pip uninstall PyInstaller
          uv run python -m pip cache remove PyInstaller
          uv run python -m pip install --verbose --no-binary=PyInstaller PyInstaller
          New-Item -ItemType Directory -Force -Path exe-dist | Out-Null
          uv run python -m PyInstaller --noconsole --onefile --icon=docs/images/test.jpg --name Authipy --distpath exe-dist src/authipy/main.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            package-dist/*
            exe-dist/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        shell: bash
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv run python -m twine check package-dist/*
          uv run python -m twine upload --verbose package-dist/*
